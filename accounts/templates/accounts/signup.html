{% extends 'base.html' %}
{% block title %}Sign up{% endblock %}
{% block content %}
<h2>Create account</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="primary" type="submit">Sign up</button>
</form>
<p>Already registered? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
