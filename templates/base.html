<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}TaskFlow{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f5f6f8; }
        nav { background: #1f2937; color: white; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        nav a, nav button { color: white; text-decoration: none; background: none; border: none; font-size: 1rem; cursor: pointer; margin-left: 16px; }
        main { margin: 32px auto; padding: 0 16px; }
        main.narrow { max-width: 420px; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
        main.wide { max-width: 1100px; }
        input, textarea { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; font-family: inherit; }
        button.primary, a.primary { display: inline-block; padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        form button.primary { width: 100%; }
        .errorlist { color: #b91c1c; padding-left: 16px; margin: 0 0 8px; }
        .helptext { color: #6b7280; font-size: .8rem; }
        .card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 12px; }
        .card a { color: #111827; text-decoration: none; font-weight: bold; }
        .muted { color: #6b7280; font-size: .85rem; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .board { display: flex; gap: 16px; align-items: flex-start; overflow-x: auto; }
        .column { background: #e5e7eb; border-radius: 8px; padding: 12px; min-width: 260px; flex: 1; }
        .column h3 { margin: 0 0 12px; }
        .task { background: white; border-radius: 6px; padding: 10px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
        .badge { font-size: .7rem; padding: 2px 8px; border-radius: 10px; color: white; }
        .badge.low { background: #16a34a; } .badge.medium { background: #d97706; } .badge.high { background: #dc2626; }
        .activity li { margin: 4px 0; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}"><strong>TaskFlow</strong></a>
        <div>
            {% if user.is_authenticated %}
                {{ user.email }}
                <form method="post" action="{% url 'logout' %}" style="display:inline">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Sign up</a>
            {% endif %}
        </div>
    </nav>
    <main class="{% block main_class %}narrow{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
